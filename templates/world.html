<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Weather Map — FocusMirror</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='global-ui.css') }}">
  <style>
    body { margin: 0; padding: 0; }
    
    #map {
      width: 100%;
      height: 100vh;
    }
    
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(180deg, rgba(15, 12, 41, 0.85), transparent);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .stats {
      display: flex;
      gap: 12px;
    }
    
    .stat {
      background: rgba(26, 26, 46, 0.5);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 16px;
      text-align: center;
    }
    
    .stat-val {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .stat-lbl {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .legend {
      position: fixed;
      bottom: 24px;
      left: 20px;
      z-index: 1000;
      background: rgba(26, 26, 46, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      color: #fff;
    }
    
    .leg-title {
      font-size: 11px;
      color: #667eea;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    
    .leg-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }
    
    .leg-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    .back {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 1000;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    
    .back:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    
    .pulse-info {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      font-size: 11px;
      color: #666;
    }
    
    .no-data {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      text-align: center;
      color: #555;
      display: none;
      background: rgba(26, 26, 46, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
    }
    
    .no-data h2 {
      color: #fff;
      margin-bottom: 10px;
      font-size: 22px;
    }
    
    @media (max-width: 768px) {
      .overlay {
        flex-wrap: wrap;
        gap: 12px;
      }
      
      .stats {
        width: 100%;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="logo">Focus<span style="color: #fff;">Mirror</span> 🌍 World</div>
    <div class="stats">
      <div class="stat"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">Total Sessions</div></div>
      <div class="stat"><div class="stat-val" id="s-avg">--</div><div class="stat-lbl">Avg Focus</div></div>
      <div class="stat"><div class="stat-val" id="s-recent">0</div><div class="stat-lbl">Active (1hr)</div></div>
    </div>
  </div>

  <div id="map"></div>

  <div class="no-data" id="no-data">
    <div style="font-size:56px;margin-bottom:16px">🌍</div>
    <h2>No sessions mapped yet</h2>
    <p>Use the app and allow location access to appear on the map</p>
  </div>

  <div class="legend">
    <div class="leg-title">Focus Score</div>
    <div class="leg-row"><div class="leg-dot" style="background:#1D9E75"></div>High Focus (70+)</div>
    <div class="leg-row"><div class="leg-dot" style="background:#EF9F27"></div>Medium (45-69)</div>
    <div class="leg-row"><div class="leg-dot" style="background:#E24B4A"></div>Low Focus (0-44)</div>
    <div class="leg-row"><div class="leg-dot" style="background:#fff;border:2px solid #667eea"></div>Active now</div>
  </div>

  <a href="/app" class="back">← Back to App</a>
  <div class="pulse-info">Auto-refreshes every 30 seconds</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 18
    }).addTo(map);

    const markers = L.layerGroup().addTo(map);

    function sc(s){ return s>=70?'#1D9E75':s>=45?'#EF9F27':'#E24B4A'; }

    function isRecent(t){ return Date.now() - new Date(t) < 3600000; }

    async function loadData() {
      const r = await fetch('/api/world-data');
      const data = await r.json();
      markers.clearLayers();
      if (!data.length) {
        document.getElementById('no-data').style.display = 'block';
        return;
      }
      document.getElementById('no-data').style.display = 'none';
      const scores = data.map(d => d.score);
      const recent = data.filter(d => isRecent(d.time));
      document.getElementById('s-total').textContent = data.length;
      document.getElementById('s-avg').textContent = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
      document.getElementById('s-recent').textContent = recent.length;
      data.forEach(d => {
        const rec = isRecent(d.time);
        const c = sc(d.score);
        L.circleMarker([d.lat, d.lng], {
          radius: rec ? 14 : 8,
          fillColor: c,
          color: rec ? '#fff' : c,
          weight: rec ? 2 : 1,
          opacity: 0.9,
          fillOpacity: rec ? 0.95 : 0.55
        }).bindPopup(`<b>Focus Score: ${d.score}</b><br><small>${rec ? '🟢 Active now' : d.time.split('T')[0]}</small>`).addTo(markers);
      });
    }
    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
